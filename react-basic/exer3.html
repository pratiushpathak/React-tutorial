function Input(){
 const[ivalue,setvalue]= React.useState("");
  function value(e){
    setvalue(e.target.value)

  }
  function reset(){
    setvalue("");
  }
  function example()
  {
    setvalue("Pratiush")
  
  }
  return(
    <>
    <input onChange={value} value={ivalue} type="text"/>
    <p>{ivalue}</p>
    <button onClick={reset}>reset</button>
    <button onClick={example}>Example</button>
    </>
  )
}

function App()
{
  return(
    <>
    <Input/>
    </>

  )
}
