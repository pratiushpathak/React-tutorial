function App()
{
const[count,setcount]=React.useState(0);
const click=React.useRef(null)
const buttonRef=React.useRef(null)
function update()
{
  setcount(count+1);
}
function reset()
{
  clearInterval(click.current);//clear withinterval id
  setcount(0);
}
function autocllick()
{
 click.current=setInterval(() => {
  
  buttonRef.current.click();
 }, 1000);

}



  return(
    <>
    <p>{count}</p>
      <button ref={buttonRef} onClick={update}>
        clicked {count} time
      </button>
      <button onClick={reset}>reset</button>
      <button onClick={autocllick}>autoclick</button>

    </>
  )
}
 
   
  


      
  
   



const app=(
  <>
<App/>

  </>
)

      ReactDOM.createRoot(container).render(app);
